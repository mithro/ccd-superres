[project]
name = "ccdsr"
version = "0.0.1"
description = "Scanning lensless sensor super-resolution simulator"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["ccdsr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
